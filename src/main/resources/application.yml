spring:
  application:
    name: ai-engineering-level-one
  profiles:
    default: ollama,local-rag
  ai:
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}

---
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
        temperature: ${OLLAMA_TEMPERATURE:0.2}

app:
  ai:
    provider: ollama
    model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

---
spring:
  config:
    activate:
      on-profile: openai-compatible
  ai:
    model:
      chat: openai
    openai:
      base-url: ${OPENAI_BASE_URL}
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL}

app:
  ai:
    provider: openai-compatible
    model: ${OPENAI_CHAT_MODEL}
    base-url: ${OPENAI_BASE_URL}

---
spring:
  config:
    activate:
      on-profile: local-rag
  ai:
    model:
      embedding: ollama
    ollama:
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        tenant-name: ${CHROMA_TENANT_NAME:SpringAiTenant}
        database-name: ${CHROMA_DATABASE_NAME:SpringAiDatabase}
        collection-name: ${CHROMA_COLLECTION_NAME:rag_documents}
        initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:false}

app:
  rag:
    chroma:
      mode: local
      host: ${CHROMA_HOST:http://localhost}
      port: ${CHROMA_PORT:8000}
      collection-name: ${CHROMA_COLLECTION_NAME:rag_documents}
      initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:false}
      check-on-startup: ${CHROMA_CONNECTIVITY_CHECK_ENABLED:false}
    embedding:
      provider: ollama
      model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

---
spring:
  config:
    activate:
      on-profile: remote-rag
  ai:
    model:
      embedding: openai
    openai:
      embedding:
        base-url: ${EMBEDDING_OPENAI_BASE_URL}
        api-key: ${EMBEDDING_OPENAI_API_KEY}
        model: ${EMBEDDING_OPENAI_MODEL}
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST}
          port: ${CHROMA_PORT:443}
          key-token: ${CHROMA_KEY_TOKEN}
        tenant-name: ${CHROMA_TENANT_NAME}
        database-name: ${CHROMA_DATABASE_NAME}
        collection-name: ${CHROMA_COLLECTION_NAME:rag_documents}
        initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:false}

app:
  rag:
    chroma:
      mode: cloud
      host: ${CHROMA_HOST}
      port: ${CHROMA_PORT:443}
      collection-name: ${CHROMA_COLLECTION_NAME:rag_documents}
      initialize-schema: ${CHROMA_INITIALIZE_SCHEMA:false}
      check-on-startup: ${CHROMA_CONNECTIVITY_CHECK_ENABLED:false}
    embedding:
      provider: openai-compatible
      model: ${EMBEDDING_OPENAI_MODEL}
      base-url: ${EMBEDDING_OPENAI_BASE_URL}
