spring:
  application:
    name: ai-engineering-level-one
  ai:
    model:
      chat: ${AI_MODEL_CHAT:ollama}
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
          temperature: ${OLLAMA_TEMPERATURE:0.2}

app:
  ai:
    provider: ${AI_MODEL_CHAT:ollama}
    model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
