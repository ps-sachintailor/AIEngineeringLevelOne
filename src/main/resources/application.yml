spring:
  application:
    name: ai-engineering-level-one
  profiles:
    default: ollama
  ai:
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}

---
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
        temperature: ${OLLAMA_TEMPERATURE:0.2}

app:
  ai:
    provider: ollama
    model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

---
spring:
  config:
    activate:
      on-profile: openai-compatible
  ai:
    model:
      chat: openai
    openai:
      base-url: ${OPENAI_BASE_URL}
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL}

app:
  ai:
    provider: openai-compatible
    model: ${OPENAI_CHAT_MODEL}
    base-url: ${OPENAI_BASE_URL}
