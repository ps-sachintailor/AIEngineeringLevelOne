spring:
  application:
    name: ai-engineering-level-one
  ai:
    model:
      chat: ${AI_MODEL_CHAT:none}
      embedding: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}

app:
  ai:
    provider: ${AI_MODEL_CHAT:none}
    model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
